name: Build, Test and Deploy Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # === JOB 1: TESTS ===
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npx eslint src/ --ext .js,.jsx || echo "Linting completed"
        continue-on-error: true # Линтинг не должен блокировать

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests --coverage

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            coverage/

  # === JOB 2: BUILD ===
  build:
    runs-on: ubuntu-latest
    needs: test # Зависит от успешного выполнения test job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          echo "=== Build files structure ==="
          ls -la build/
          echo ""
          echo "=== Checking paths in index.html ==="
          grep -o 'src="[^"]*"' build/index.html | head -3

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/

  # === JOB 3: DEPLOY ===
  deploy:
    runs-on: ubuntu-latest
    needs: build # Зависит от успешного выполнения build job
    if: github.event_name == 'push' # Только при пуше в main

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Setup .nojekyll file
        run: touch .nojekyll

      - name: Deploy to GitHub Pages
        id: deployment
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: . # Используем текущую директорию с артефактами
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
