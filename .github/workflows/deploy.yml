name: Build, Test and Deploy Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # === JOB 1: TESTS ===
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npx eslint src/ --ext .js,.jsx || echo "Linting completed"
        continue-on-error: true

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests --coverage

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            coverage/

  # === JOB 2: BUILD ===
  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          echo "=== Build files structure ==="
          ls -la build/
          echo ""
          echo "=== Checking paths in index.html ==="
          grep -o 'src="[^"]*"' build/index.html | head -3

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/

  # === JOB 3: DEPLOY ===
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      site_url: ${{ steps.deployment.outputs.page_url }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Setup .nojekyll file
        run: touch .nojekyll

      - name: Deploy to GitHub Pages
        id: deployment
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Show deployment URL
        run: |
          echo "=========================================="
          echo "🚀 DEPLOYMENT SUCCESSFUL!"
          echo "=========================================="
          echo ""
          echo "📦 Project: front-blog"
          echo "🌐 Your site is now live at:"
          echo "🔗 https://leewhocan.github.io/front-blog/"
          echo ""
          echo "📊 GitHub Pages URL: ${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "📅 Deployment completed at: $(date)"
          echo "=========================================="

  # === JOB 4: FINAL REPORT ===
  report:
    runs-on: ubuntu-latest
    needs: [test, build, deploy]
    if: always()

    steps:
      - name: Generate pipeline report
        run: |
          echo "████████████████████████████████████████"
          echo "█      PIPELINE EXECUTION REPORT      █"
          echo "████████████████████████████████████████"
          echo ""
          echo "📊 JOB STATUS:"
          echo "  ✅ test:   ${{ needs.test.result }}"
          echo "  ✅ build:  ${{ needs.build.result }}"
          echo "  ✅ deploy: ${{ needs.deploy.result }}"
          echo ""

          if [[ "${{ needs.test.result }}" == "success" && \
                "${{ needs.build.result }}" == "success" && \
                "${{ needs.deploy.result }}" == "success" ]]; then
            echo "🎉 ALL JOBS COMPLETED SUCCESSFULLY!"
            echo ""
            echo "🌐 YOUR SITE IS LIVE:"
            echo "   https://leewhocan.github.io/front-blog/"
            echo ""
            echo "🔗 Direct link: ${{ needs.deploy.outputs.page_url }}"
            echo ""
            echo "📈 View deployment details:"
            echo "   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "🕐 Pipeline completed at: $(date)"
          else
            echo "❌ PIPELINE FAILED"
            echo ""
            echo "Failed jobs:"
            [[ "${{ needs.test.result }}" != "success" ]] && echo "  ✗ test job failed"
            [[ "${{ needs.build.result }}" != "success" ]] && echo "  ✗ build job failed"
            [[ "${{ needs.deploy.result }}" != "success" ]] && echo "  ✗ deploy job failed"
            echo ""
            echo "🔍 Check logs for details:"
            echo "   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          echo "████████████████████████████████████████"
