9NBname: Build for GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify build
        run: |
          echo "=== Checking index.html paths ==="
          grep -o 'src="[^"]*"' build/index.html
          echo ""
          echo "=== Should show /front-blog/static/... ==="

      - name: Prepare deployment
        run: |
          # Удаляем все, кроме build папки
          rm -rf public src .github README.md package.json package-lock.json
          # Перемещаем содержимое build в корень
          mv build/* .
          rm -rf build
          # Создаем .nojekyll
          touch .nojekyll
          echo "Deployment files ready in root"

      - name: Deploy to main
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Deploy to GitHub Pages from main"
          git push origin main
