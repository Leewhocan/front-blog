name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Добавь этот блок permissions на уровне workflow
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify build
        run: |
          echo "=== Checking index.html paths ==="
          grep -o 'src="[^"]*"' build/index.html
          echo ""
          echo "=== Should show /front-blog/static/... ==="

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
